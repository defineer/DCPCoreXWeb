<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
	<style>
		.cloud {
		animation: pulse 3s ease-in-out infinite;
		}
		@keyframes pulse {
		0%, 100% {
		transform: scale(1);
		opacity: 0.6;
		}
		50% {
		transform: scale(1.05);
		opacity: 1;
		}
		}
	</style>

	<!-- DCP brand text -->
	<text x="38" y="78" font-size="42" font-family="Segoe UI, sans-serif" fill="#7038ad" font-weight="bold">
		DCP
	</text>
</svg>